# Tests run against an in-memory H2 database in MySQL mode, migrated by the same Flyway scripts.
spring.datasource.url=jdbc:h2:mem:crmtest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1;TIME ZONE=UTC
spring.datasource.username=sa
spring.datasource.password=
crm.demo-data=false
crm.test-account=false
crm.frontend-autostart=false
crm.root-username=root
crm.root-password=root-test-password
crm.admin-username=admin
crm.admin-password=test-admin-password
crm.jwt-secret=test-jwt-secret-0123456789abcdef-0123456789abcdef
crm.reminders-enabled=false
