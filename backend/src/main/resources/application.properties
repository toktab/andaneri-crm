spring.application.name=andaneri-crm
# Local settings live in backend/.env (copy .env.example); real environment variables win over it.
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# 8082 so it can run beside other Spring Boot apps on the same machine (gidige uses 8081).
server.port=${PORT:8082}
server.error.include-message=never

# --- Database: MySQL. Run db/create-local-database.sql once, then put the password in .env.
# For a look around without MySQL, start with the "demo" profile instead (see README).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/andaneri_crm?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:andaneri}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.open-in-view=false
# Flyway owns the schema (src/main/resources/db/migration); Hibernate never changes tables.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# Loads related rows (types, assignees, sheets) in batches instead of one query per row on long lists.
spring.jpa.properties.hibernate.default_batch_fetch_size=64

# Lists and the spreadsheet view send a lot of JSON: compress it.
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/html,text/css,text/javascript,application/javascript,image/svg+xml
server.compression.min-response-size=1024

# Excel files from the old spreadsheet can be a few MB.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# --- crm.* (see CrmProperties)
# Long random string that signs login tokens. Change it anywhere other than your own computer.
crm.jwt-secret=${JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
# A salesperson on a phone should not have to sign in every morning: one week.
crm.token-hours=${TOKEN_HOURS:168}
# "Today", "overdue" and the calendar are all counted in this time zone.
crm.zone=${CRM_ZONE:Asia/Tbilisi}
# The first admin account, created only while the users table is empty. Change the password after signing in.
crm.admin-username=${ADMIN_USERNAME:admin}
crm.admin-password=${ADMIN_PASSWORD:andaneri-admin}
# Example businesses, calls and purchases to click around in. Never turn this on for the real database.
crm.demo-data=${DEMO_DATA:false}
# A throwaway admin login "test" with password "test", for trying the app out. Set TEST_ACCOUNT=false
# before real use; switching it off also deactivates the account if it already exists.
crm.test-account=${TEST_ACCOUNT:true}
# Only when the frontend calls the API from another site instead of through its /api proxy.
crm.cors-origins=${CORS_ORIGINS:}

# --- Root: the one account with everything, including the security centre. Set both in .env or the environment.
crm.root-username=${ROOT_USERNAME:}
crm.root-password=${ROOT_PASSWORD:}
# Keep the full text of failed passwords in the sign-in log (otherwise a masked hint). See CrmProperties.
crm.log-full-failed-passwords=${LOG_FULL_FAILED_PASSWORDS:false}
crm.root-bypass-whitelist=${ROOT_BYPASS_WHITELIST:true}
# Behind a reverse proxy (nginx, Caddy) set FORWARD_HEADERS=native so the real visitor address is logged.
server.forward-headers-strategy=${FORWARD_HEADERS:none}
# Or, where the platform's proxy puts the visitor address in its own header (Railway: X-Real-IP), that header.
crm.client-ip-header=${CLIENT_IP_HEADER:}

# --- Reminders: push notifications to phones and laptops. The signing keys are created and stored in the
# database on first use; set VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY only to bring existing keys along.
crm.reminders-enabled=${REMINDERS_ENABLED:true}
crm.vapid-public-key=${VAPID_PUBLIC_KEY:}
crm.vapid-private-key=${VAPID_PRIVATE_KEY:}
crm.vapid-subject=${VAPID_SUBJECT:mailto:crm@andaneri.ge}

# --- Frontend: served by this application on the same port. Started from the IDE, it is also built and
# rebuilt on every change (needs Node.js). A packaged jar serves FRONTEND_DIST or its bundled copy.
crm.frontend-autostart=${FRONTEND_AUTOSTART:true}
crm.frontend-dir=${FRONTEND_DIR:}
crm.frontend-dist=${FRONTEND_DIST:}
