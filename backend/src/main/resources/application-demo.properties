# Runs the whole CRM without a MySQL server: a file database in backend/data, filled with example data.
# Start with:  mvnw spring-boot:run -Dspring-boot.run.profiles=demo
# Delete backend/data to start over.
# TIME ZONE=UTC: like the MySQL connection (connectionTimeZone=UTC), so rows written through Hibernate and
# through plain JDBC (the change log) hold the same clock.
spring.datasource.url=jdbc:h2:file:./data/andaneri-demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;TIME ZONE=UTC
spring.datasource.username=sa
spring.datasource.password=
crm.demo-data=true
# A root login so the security centre can be tried out too. Demo database only; real installs set ROOT_* in .env.
crm.root-username=${ROOT_USERNAME:root}
crm.root-password=${ROOT_PASSWORD:demo-root-12345}
