<!doctype html>
<html lang="ka">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b0127f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23b0127f'/%3E%3Cpath d='M22 48c-5 0-8-3-8-7 0-3 2-5 5-7l12-22h6l12 22c3 2 5 4 5 7 0 4-3 7-8 7-3 0-5-1-7-4-2 3-4 4-7 4-2 0-4-1-5-2-1 1-3 2-5 2z' fill='white'/%3E%3C/svg%3E" />
    <title>Andaneri CRM</title>
    <!-- Installable on the Home Screen: on iPhone that is what allows push reminders. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Andaneri" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      // Dark theme before the first paint, so a dark page never flashes white. Same rule as lib/theme.tsx.
      try {
        var saved = localStorage.getItem('andaneri.theme')
        if (saved === 'dark' || (saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
